name: Relay checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay_ci_only
          POSTGRES_DB: relay_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay_ops"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      RELAY_DATA_SOURCE: database
      DATABASE_URL: postgresql://relay:relay_ci_only@127.0.0.1:5432/relay_ops
      TEST_DATABASE_URL: postgresql://relay:relay_ci_only@127.0.0.1:5432/relay_ops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Create dedicated test database
        run: |
          node --input-type=module -e '
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          await client.query("CREATE DATABASE relay_ops_test");
          await client.end();'
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run queue:init
      - run: npm run test:db
      - run: npm run build
